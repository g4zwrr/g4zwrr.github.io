stages:
  - deploy

pages:
  stage: deploy
  image: alpine:latest
  interruptible: true
  script:
    - mkdir -p public
    - find . -mindepth 1 -maxdepth 1 ! -name .git ! -name public ! -name .gitlab-ci.yml -exec cp -a {} public/ \;
    - test -f public/index.html
    - test -f public/assets/css/site.css
    - test ! -e public/.git
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
