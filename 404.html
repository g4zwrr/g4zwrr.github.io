<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oops something's wrong</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;800&display=swap');

  :root{
    --bg:#000000;
    --fg:#ffffff;
    --fg-dim:rgba(255,255,255,0.72);
    --line:rgba(255,255,255,0.12);
    --bg-panel:rgba(255,255,255,0.035);
    --accent:#ffffff;
    --r:2px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html{
    scrollbar-color:rgba(255,255,255,0.25) #000000;
  }
  body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    min-height: 100svh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
  }
  ::selection{ background: var(--accent); color: var(--bg); }

  .message-box {
    position: relative;
    z-index: 10;
    pointer-events: none;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 36px 32px;
    max-width: 460px;
  }
  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 18px;
    color: var(--fg);
  }
  p {
    font-size: 15px;
    color: var(--fg-dim);
    line-height: 1.6;
  }
  #countdown {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  #teto {
    position: fixed;
    width: 120px;
    height: auto;
    top: 0;
    left: 0;
    user-select: none;
    pointer-events: none;
    opacity: 0.92;
  }

  @media (prefers-reduced-motion: reduce){
    #teto{ display: none; }
  }
</style>
</head>
<body>

<div class="message-box">
  <h1>Oops something's wrong.</h1>
  <p id="redirect-msg">Redirecting in <span id="countdown">5</span> seconds…</p>
</div>

<img id="teto" src="teto.gif" alt="Bouncing Teto">

<script>
  const img = document.getElementById('teto');
  let x = Math.random() * (window.innerWidth - 120);
  let y = Math.random() * (window.innerHeight - 120);
  let dx = 3;
  let dy = 3;

  function move() {
    const imgWidth = img.offsetWidth || 120;
    const imgHeight = img.offsetHeight || 120;

    x += dx;
    y += dy;

    if (x + imgWidth >= window.innerWidth || x <= 0) {
      dx = -dx;
    }
    if (y + imgHeight >= window.innerHeight || y <= 0) {
      dy = -dy;
    }

    img.style.left = x + 'px';
    img.style.top = y + 'px';

    requestAnimationFrame(move);
  }

  window.addEventListener('resize', () => {
    x = Math.min(x, window.innerWidth - 120);
    y = Math.min(y, window.innerHeight - 120);
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) requestAnimationFrame(move);

  const KNOWN_ROUTES = ["projects", "about", "contact"];
  const firstSegment = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
  if (KNOWN_ROUTES.includes(firstSegment)) {
    const preserved = location.pathname + location.search + location.hash;
    document.getElementById("redirect-msg").textContent = "Loading requested page...";
    window.location.replace("/?p=" + encodeURIComponent(preserved));
  } else {
let timeLeft = 5;
  const redirectMsg = document.getElementById('redirect-msg');
  const countdownEl = document.getElementById('countdown');

  const timer = setInterval(() => {
    timeLeft--;
    if (timeLeft > 1) {
      countdownEl.textContent = timeLeft;
    } else if (timeLeft === 1) {
      redirectMsg.innerHTML = 'Redirecting in 1 second…';
    } else {
      clearInterval(timer);
      redirectMsg.textContent = 'please wait...';
      window.location.replace("https://g4zwr.is-a.dev");
    }
  }, 1000);
  }
</script>

</body>
</html>
